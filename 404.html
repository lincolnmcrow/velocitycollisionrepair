<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080808">
  <title>Page Not Found | Velocity Collision Repair</title>
  <link rel="icon" type="image/png" href="/assets/velocity-logo-trim.png">
  <link rel="apple-touch-icon" href="/assets/velocity-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--red:#ed0716;--black:#050505;--white:#f7f7f7;--muted:#a6a6a6;--line:#292929}
    *{box-sizing:border-box;margin:0}
    body{background:var(--black);color:var(--white);font-family:Inter,Arial,sans-serif;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{width:min(1160px,92%);margin:auto}
    header{position:absolute;top:0;left:0;right:0;z-index:2;padding:15px 0}
    .brand img{width:116px;height:58px;object-fit:contain}
    main{flex:1;display:flex;align-items:center;padding:130px 0 80px;background:linear-gradient(90deg,#050505 10%,#050505e0 50%,#05050566),linear-gradient(0deg,#050505 0%,transparent 45%),url('/assets/velocity-red-hero.png') center/cover}
    .eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:#ddd}
    .eyebrow:before{content:'';display:inline-block;width:35px;height:2px;background:var(--red);vertical-align:middle;margin-right:10px}
    .code{font:900 clamp(7rem,22vw,14rem)/.8 'Barlow Condensed',Impact,sans-serif;color:transparent;-webkit-text-stroke:2px var(--red);margin-top:22px}
    h1{font:900 clamp(3.4rem,8vw,6.5rem)/.85 'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;margin:18px 0 20px}
    h1 span{color:var(--red)}
    p{max-width:520px;color:#c4c4c4;line-height:1.8;margin-bottom:30px}
    .actions{display:flex;flex-wrap:wrap;gap:10px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:15px 24px;border:1px solid var(--red);font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;transition:transform .2s}
    .btn:hover{transform:translateY(-2px)}
    .btn.red{background:var(--red)}
    footer{padding:28px 0;border-top:1px solid var(--line);color:#777;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}
    .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .foot a{color:#fff}
    @media(max-width:600px){
      .brand img{width:88px;height:48px}
      main{padding:110px 0 60px;background:linear-gradient(180deg,#050505cc,#050505f2 55%),url('/assets/velocity-red-hero.png') 80% 0/auto 100% no-repeat,#050505}
      .actions{display:grid;grid-template-columns:1fr 1fr}
      .actions .btn{padding:15px 10px}
      .actions .btn.red{grid-column:1/-1}
    }
    ::selection{background:var(--red);color:#fff}
    :focus-visible{outline:2px solid var(--red);outline-offset:3px}
    .btn:active{transform:scale(.97);transition-duration:.06s}
    .code{filter:drop-shadow(0 0 18px #ed071655)}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}}
    @keyframes neon{0%{opacity:.08}7%{opacity:1}9%{opacity:.15}13%{opacity:.9}16%{opacity:.25}23%,100%{opacity:1}}
    @media (prefers-reduced-motion:no-preference){
      .code{animation:neon 1.8s linear .2s backwards}
      .eyebrow,h1,p,.actions{animation:rise .7s cubic-bezier(.16,1,.3,1) backwards}
      .eyebrow{animation-delay:.1s}h1{animation-delay:.55s}p{animation-delay:.65s}.actions{animation-delay:.75s}
    }
  </style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-024YDSHSC1"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-024YDSHSC1');</script>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="/" aria-label="Velocity Collision Repair home"><img src="/assets/velocity-logo-trim.png" alt="Velocity Collision Repair logo"></a></div></header>
  <main>
    <div class="wrap">
      <div class="eyebrow">Error 404</div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Wrong <span>turn.</span></h1>
      <p>The page you're looking for doesn't exist or may have moved. Let's get you back on the road.</p>
      <div class="actions">
        <a class="btn red" href="/">Back To Home →</a>
        <a class="btn" href="/#quote">Get A Quote</a>
        <a class="btn" href="/#location">Find The Shop</a>
      </div>
    </div>
  </main>
  <footer><div class="wrap foot"><span>Velocity Collision Repair · Fort Worth, TX</span><a href="https://www.instagram.com/velocitycollisionrepair/" target="_blank" rel="noreferrer">Instagram ↗</a></div></footer>
</body>
</html>
